name: Corrigir atividade de arvore binaria

on:
  push:
  pull_request:

jobs:
  corrigir:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o codigo
        uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Compilar e corrigir
        run: |
          mkdir -p out
          find . -name '*.java' -not -path './corretor/*' -not -path './gabarito/*' -not -path './out/*' > fontes.txt
          echo "Arquivos do aluno encontrados:"
          cat fontes.txt
          javac -encoding UTF-8 -d out @fontes.txt corretor/Corretor.java
          java -cp out Corretor
